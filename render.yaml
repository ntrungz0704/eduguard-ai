services:
  - type: web
    runtime: node
    name: eduguard-ai
    branch: main
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://eduguard-ai.onrender.com
      - key: DATABASE_URL
        value: file:/app/prisma/dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
