version: '3.8'

services:
  # 1. Frontend - Vercel Build Simulation (React SPA)
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
      target: frontend-builder
    container_name: eduguard_frontend
    command: npm run dev --prefix client -- --host 0.0.0.0
    ports:
      - "80:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    networks:
      - eduguard-net

  # 2. Backend - REST API Server
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: eduguard_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://eduguard:supersecret@postgres:5432/eduguard_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db # Fallback SQLite
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - eduguard-net

  # 3. AI Worker - Background Jobs (Prediction & Retraining)
  ai-worker:
    build: 
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: eduguard_ai_worker
    command: npm run start:worker # Giả định lệnh chạy worker queue
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://eduguard:supersecret@postgres:5432/eduguard_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks:
      - eduguard-net

  # 4. Message Queue Cache
  redis:
    image: redis:alpine
    container_name: eduguard_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eduguard-net

  # 5. Primary Database
  postgres:
    image: postgres:15-alpine
    container_name: eduguard_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=eduguard
      - POSTGRES_PASSWORD=supersecret
      - POSTGRES_DB=eduguard_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduguard -d eduguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eduguard-net

networks:
  eduguard-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
