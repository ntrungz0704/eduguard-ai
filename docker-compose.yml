version: '3.8'

services:
  eduguard-api:
    build: .
    container_name: eduguard-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    volumes:
      - ./server/prisma/dev.db:/app/server/prisma/dev.db
      - ./server/ai_engine/model_data:/app/server/ai_engine/model_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
