name: EduGuard AI — CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm ci --legacy-peer-deps

    - name: Install Client Dependencies
      run: cd client && npm ci --legacy-peer-deps

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Lint Code
      run: npm run lint --if-present

    - name: Run Unit Tests (AI Engine)
      run: npm test
      env:
        NODE_ENV: test
        DATABASE_URL: "file:./prisma/dev.db"

    - name: Security Audit (High & Critical only)
      run: npm audit --audit-level=high
      continue-on-error: true  # Report but don't block CI until fixed

    - name: Train ML Pipeline (Smoke Test)
      run: npm run train

    - name: Build Frontend
      run: cd client && npm run build

    - name: Test Docker Image Build
      run: docker build -t eduguard-api:test .

